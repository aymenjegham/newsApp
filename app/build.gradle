apply plugin: 'com.android.application'

apply plugin: 'com.android.legacy-kapt'

apply plugin: "androidx.navigation.safeargs.kotlin"

def apiKey = providers.gradleProperty('MY_API_KEY')
if (!apiKey.isPresent()) {
    throw new GradleException('Set MY_API_KEY to a quoted NewsAPI key in ~/.gradle/gradle.properties (MY_API_KEY="your-key"). Do not commit credentials.')
}

android {
    namespace 'com.angelstudio.newsapp'
    compileSdk 37
    defaultConfig {
        applicationId "com.angelstudio.newsapp"
        minSdk 24
        targetSdk 37
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug{
            buildConfigField 'String', 'ApiKey', apiKey.get()
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'ApiKey', apiKey.get()
        }
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    // Room's bundled metadata reader predates Kotlin 2.4.
    kapt "org.jetbrains.kotlin:kotlin-metadata-jvm:$kotlin_version"

    // Gson
    implementation 'com.google.code.gson:gson:2.14.0'

    // Kotlin Android Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"


    // ViewModel
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    // Kodein
    implementation "org.kodein.di:kodein-di:$kodein_version"
    implementation "org.kodein.di:kodein-di-framework-android-x:$kodein_version"

    // Glide
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    kapt 'com.github.bumptech.glide:compiler:5.0.9'

    // Preference
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // New Material Design
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    //database viewer tool
    debugImplementation 'com.github.amitshekhariitbhu.Android-Debug-Database:debug-db:1.0.7'

    // Youtube video player
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:13.0.0'

    // Material dialogs
    implementation 'com.afollestad.material-dialogs:core:3.3.0'

    //cool toasts
    implementation 'com.github.GrenderG:Toasty:1.5.2'

    implementation 'tyrantgit:explosionfield:1.0.1'
}
