apply plugin: 'com.android.application'

apply plugin: 'com.android.legacy-kapt'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.google.dagger.hilt.android'

def apiKey = providers.gradleProperty('MY_API_KEY')
if (!apiKey.isPresent()) {
    throw new GradleException('Set MY_API_KEY to a quoted NewsAPI key in ~/.gradle/gradle.properties (MY_API_KEY="your-key"). Do not commit credentials.')
}

android {
    namespace 'com.angelstudio.newsapp'
    compileSdk 37
    defaultConfig {
        applicationId "com.angelstudio.newsapp"
        minSdk 24
        targetSdk 37
        versionCode 22
        versionName "2.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug{
            buildConfigField 'String', 'ApiKey', apiKey.get()
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'ApiKey', apiKey.get()
        }
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.kotlin.stdlib
    implementation platform(libs.compose.bom)
    androidTestImplementation platform(libs.compose.bom)
    implementation libs.activity.compose
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    debugImplementation libs.compose.ui.tooling
    androidTestImplementation libs.compose.ui.test.junit4
    debugImplementation libs.compose.ui.test.manifest
    implementation libs.navigation3.runtime
    implementation libs.navigation3.ui
    implementation libs.lifecycle.runtime.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.coil.compose
    implementation libs.coil.network.okhttp
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    implementation libs.appcompat
    implementation libs.activity.ktx
    implementation libs.fragment.ktx

    implementation libs.core.ktx

    // Room
    implementation libs.room.runtime
    kapt libs.room.compiler
    // Room's bundled metadata reader predates Kotlin 2.4.
    kapt libs.kotlin.metadata.jvm

    // Gson
    implementation libs.gson

    // Kotlin Android Coroutines
    implementation libs.coroutines.android

    // Retrofit
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson


    // ViewModel
    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.viewmodel.ktx

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core

    //database viewer tool
    debugImplementation libs.debug.db

}
