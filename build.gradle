// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.4.20'
    ext.room_version = '2.8.5'
    ext.nav_version = '2.10.2'
    ext.kodein_version = '7.33.0'
    ext.lifecycle_version = '2.11.0'
    ext.retrofit_version = '3.0.0'
    repositories {
        google()
        mavenCentral()
        
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.android.tools.build:gradle-kotlin:9.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // ExplosionField was only published to JCenter; keep its archive isolated.
        exclusiveContent {
            forRepository {
                maven { url 'https://maven.aliyun.com/repository/public' }
            }
            filter { includeModule('tyrantgit', 'explosionfield') }
        }
        
    }
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
